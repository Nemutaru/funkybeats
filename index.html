<!DOCTYPE html>
<html>

<head>
	<title>FB:R Web Convert</title>
	<link rel="icon" type="image/x-icon" href="/SiteIcon.png">
	<meta charset="ASCII" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
	<script>
		var module = {}
		module.__exports = {}
		module.export = function (name, obj) {
			if (module.__exports[name] != null) {
				throw "export already exists::" + name
			}
			module.__exports[name] = obj
		}
		module.require = function (name) {
			if (module.__exports[name] == null) {
				throw "require cannot find::" + name
			}
			return module.__exports[name]
		}
	</script>
	<script src="curves.js"></script>
	<script src="slidercalc.js"></script>
	<script src="osuparser.js"></script>
	<script src="format.js"></script>
	<script src="osu_to_lua.js"></script>
	<script src="jquery.js"></script>
	<script src="copy_paste.js"></script>
	<script>
		$(function () {
			$("#copy_to_clipboard").click(function () {
				$("#out").select();
				document.execCommand('copy');
				$("#copy_to_clipboard").text("Copied!")
			})

			$("#view_github").click(function () {
				setTimeout(function () {
					window.location.replace("https://github.com/Nemutaru/funkybeats");
				}, 200);
			})

			// When the user pastes their osu.txt, automatically convert it
			$("#in").change(function () {
				var osu_file_str = $("#in").val()

				if (osu_file_str.length != 0) {
					$("#out").val("converting...")
					$("#out").val(module.require("osu_to_lua")(osu_file_str))
					$("#copy_to_clipboard").text("Copy To Clipboard")
				}
			})
		})
	</script>

	<label for="in_label">osu.txt -> lua converter (For FunkyBeats Remix V3 and later)</label>
	<br />
	<br />
	<textarea id="in"> Paste Here </textarea>
	<br />
	<br />
	<br />
	<label for="in_label">Output</label>
	<br />
	<br />
	<textarea id="out" readonly>(Paste your .txt file above)</textarea>
	<br />
	<br />

	<button id="copy_to_clipboard"><i class="fa-solid fa-clipboard"></i>
		Copy To Clipboard
	</button>

	<button id="view_github"><i class="fa-solid fa-code-branch"></i>
		View Repository
	</button>

</body>

</html>
